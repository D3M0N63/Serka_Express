<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Pagar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="pagar.html">

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Pagar</h1>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <p class="hint" style="text-align:left; margin-top:0; margin-bottom:14px;">
        Boletas con pago "A cobrar" pendientes. Buscá y marcá como cobrada para que figure en Caja.
      </p>
      <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por código, nombre o CI/RUC..." />
      </div>
      <div id="table-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Código</th>
              <th>Remitente</th>
              <th>Destinatario</th>
              <th>Total</th>
              <th>Valor a cobrar</th>
              <th>Fecha</th>
              <th>Cobrar</th>
            </tr>
          </thead>
          <tbody id="pending-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No hay boletas en reparto pendientes de cobro para tu ciudad de destino.
        </div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <script type="module" src="js/pagar.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
