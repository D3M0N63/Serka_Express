<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Pagar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="logo">SERKA <span class="express">EXPRESS</span></div>
          <span class="logo-sub">COURRIER &middot; TODO A TIEMPO</span>
        </div>
      </a>
    </div>
    <div class="topbar-right">
      <a href="profile.html" class="profile-link">
        <div class="avatar" data-user-avatar>AE</div>
        <span class="name" data-user-name>Usuario</span>
      </a>
      <button class="logout-btn" data-logout>Salir</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="dashboard.html" class="subnav-link">Inicio</a>
    <a href="shipments.html" class="subnav-link">Envíos</a>
    <a href="clients.html" class="subnav-link">Clientes</a>
    <a href="caja.html" class="subnav-link">Caja</a>
    <a href="pagar.html" class="subnav-link active">Pagar</a>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Pagar</h1>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <p class="hint" style="text-align:left; margin-top:0; margin-bottom:14px;">
        Boletas con pago "A cobrar" pendientes. Buscá y marcá como cobrada para que figure en Caja.
      </p>
      <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por código, nombre o CI/RUC..." />
      </div>
      <div id="table-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Código</th>
              <th>Remitente</th>
              <th>Destinatario</th>
              <th>Total</th>
              <th>Fecha</th>
              <th>Cobrar</th>
            </tr>
          </thead>
          <tbody id="pending-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No hay boletas pendientes de cobro.
        </div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <script type="module" src="js/pagar.js"></script>
</body>
</html>
