<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Nuevo Usuario</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="logo">SERKA <span class="express">EXPRESS</span></div>
          <span class="logo-sub">COURRIER &middot; TODO A TIEMPO</span>
        </div>
      </a>
    </div>
    <div class="topbar-right">
      <a href="profile.html" class="profile-link">
        <div class="avatar" data-user-avatar>AE</div>
        <span class="name" data-user-name>Usuario</span>
      </a>
      <button class="logout-btn" data-logout>Salir</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="dashboard.html" class="subnav-link">Inicio</a>
    <a href="shipments.html" class="subnav-link">Envíos</a>
    <a href="planilla.html" class="subnav-link">Planilla</a>
    <a href="clients.html" class="subnav-link">Clientes</a>
    <a href="pagar.html" class="subnav-link">Pagar</a>
    <a href="caja.html" class="subnav-link">Caja</a>
    <a href="usuarios.html" class="subnav-link active">Usuarios</a>
    <a href="cierres.html" class="subnav-link">Cierres</a>
  </nav>

  <main class="page" style="max-width: 560px;">
    <div class="page-header">
      <h1 class="page-title" id="form-title">Nuevo Usuario</h1>
      <a href="usuarios.html" class="btn btn-outline">Volver a Usuarios</a>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <form id="user-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="new-password" />
          <p class="hint" id="password-hint" style="text-align:left; margin-top:6px;"></p>
        </div>
        <div class="field">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="role">Rol</label>
          <select id="role" required>
            <option value="sucursal">Sucursal</option>
            <option value="repartidor">Repartidor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="field" id="parent-field" style="display:none;">
          <label for="parent_id">Sucursal a la que pertenece</label>
          <select id="parent_id">
            <option value="">Selecciona una sucursal...</option>
          </select>
        </div>
        <div class="field">
          <label for="city">Ciudad</label>
          <input type="text" id="city" list="py-cities" placeholder="Buscar ciudad..." autocomplete="off" />
          <datalist id="py-cities"></datalist>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="save-btn">Guardar Usuario</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/new-usuario.js"></script>
</body>
</html>
