<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Nuevo Usuario</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="usuarios.html">

  <main class="page" style="max-width: 560px;">
    <div class="page-header">
      <h1 class="page-title" id="form-title">Nuevo Usuario</h1>
      <a href="usuarios.html" class="btn btn-outline">Volver a Usuarios</a>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <form id="user-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="new-password" />
          <p class="hint" id="password-hint" style="text-align:left; margin-top:6px;"></p>
        </div>
        <div class="field">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="role">Rol</label>
          <select id="role" required>
            <option value="sucursal">Sucursal</option>
            <option value="repartidor">Repartidor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="field" id="parent-field" style="display:none;">
          <label for="parent_id">Sucursal a la que pertenece</label>
          <select id="parent_id">
            <option value="">Selecciona una sucursal...</option>
          </select>
        </div>
        <div class="field">
          <label for="city">Ciudad</label>
          <input type="text" id="city" list="py-cities" placeholder="Buscar ciudad..." autocomplete="off" />
          <datalist id="py-cities"></datalist>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="save-btn">Guardar Usuario</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/new-usuario.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
