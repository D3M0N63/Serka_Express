<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalEx Courier &amp; Logistics - Nuevo Registro de Envío</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="menu-icon">&#9776;</span>
      <div>
        <div class="logo">Global<span class="ex">Ex</span></div>
        <span class="logo-sub">COURIER &amp; LOGISTICS</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="avatar" data-user-avatar>AE</div>
      <span class="name" data-user-name>Usuario</span>
      <button class="logout-btn" data-logout>Salir</button>
    </div>
  </header>

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Nuevo Registro de Envío <span class="code" id="pending-code">(el código se asigna al guardar)</span></h1>
      <a href="dashboard.html" class="btn btn-outline">Volver al Panel</a>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <form id="shipment-form">
      <div class="grid-2">
        <div class="card">
          <h2 class="card-title">Datos del Remitente</h2>
          <div class="field">
            <label for="sender_name">Nombre completo</label>
            <input type="text" id="sender_name" required />
          </div>
          <div class="field">
            <label for="sender_dni">DNI</label>
            <input type="text" id="sender_dni" />
          </div>
          <div class="field">
            <label for="sender_address">Dirección</label>
            <input type="text" id="sender_address" />
          </div>
          <div class="field">
            <label for="sender_phone">Tel</label>
            <input type="text" id="sender_phone" />
          </div>
          <div class="field">
            <label for="sender_email">Correo</label>
            <input type="email" id="sender_email" />
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Datos del Destinatario</h2>
          <div class="field">
            <label for="recipient_name">Nombre completo</label>
            <input type="text" id="recipient_name" required />
          </div>
          <div class="field">
            <label for="recipient_dni">DNI</label>
            <input type="text" id="recipient_dni" />
          </div>
          <div class="field">
            <label for="recipient_address">Dirección</label>
            <input type="text" id="recipient_address" />
          </div>
          <div class="field">
            <label for="recipient_phone">Tel</label>
            <input type="text" id="recipient_phone" />
          </div>
          <div class="field">
            <label for="recipient_email">Correo</label>
            <input type="email" id="recipient_email" />
          </div>
        </div>
      </div>

      <div class="grid-3">
        <div class="card">
          <h2 class="card-title">Detalles del Envío</h2>
          <div class="field">
            <label for="package_type">Tipo</label>
            <select id="package_type">
              <option>Paquete</option>
              <option>Documento</option>
              <option>Sobre</option>
              <option>Carga</option>
            </select>
          </div>
          <div class="field">
            <label for="package_content">Contenido</label>
            <input type="text" id="package_content" />
          </div>
          <div class="field">
            <label for="package_value">Valor</label>
            <input type="number" id="package_value" min="0" step="0.01" placeholder="0.00" />
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Origen y Destino</h2>
          <div class="field">
            <label for="origin">Origen</label>
            <input type="text" id="origin" placeholder="Ciudad, País" />
          </div>
          <div class="field">
            <label for="destination">Destino</label>
            <input type="text" id="destination" placeholder="Ciudad, País" />
          </div>
          <div class="field checkbox">
            <input type="checkbox" id="pickup_at_home" />
            <label for="pickup_at_home">Recojo en domicilio</label>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Servicio y Pago</h2>
          <div class="field">
            <label for="cost">Costo</label>
            <input type="number" id="cost" min="0" step="0.01" placeholder="0.00" />
          </div>
          <div class="field readonly">
            <label for="total">Total</label>
            <input type="text" id="total" readonly />
          </div>
          <div class="field">
            <label for="payment_method">Pago</label>
            <select id="payment_method">
              <option>Efectivo</option>
              <option>Tarjeta</option>
              <option>Transferencia</option>
              <option>Yape/Plin</option>
            </select>
          </div>
          <div class="field">
            <label for="payment_reference">Referencia</label>
            <input type="text" id="payment_reference" />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" id="print-btn">Imprimir Etiqueta</button>
        <button type="submit" class="btn btn-dark" id="save-btn">Guardar Registro de Envío</button>
      </div>
    </form>
  </main>

  <script type="module" src="js/new-shipment.js"></script>
</body>
</html>
