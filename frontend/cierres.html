<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Cierres de Caja</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="logo">SERKA <span class="express">EXPRESS</span></div>
          <span class="logo-sub">COURRIER &middot; TODO A TIEMPO</span>
        </div>
      </a>
    </div>
    <div class="topbar-right">
      <a href="profile.html" class="profile-link">
        <div class="avatar" data-user-avatar>AE</div>
        <span class="name" data-user-name>Usuario</span>
      </a>
      <button class="logout-btn" data-logout>Salir</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="dashboard.html" class="subnav-link">Inicio</a>
    <a href="shipments.html" class="subnav-link">Envíos</a>
    <a href="planilla.html" class="subnav-link">Planilla</a>
    <a href="clients.html" class="subnav-link">Clientes</a>
    <a href="pagar.html" class="subnav-link">Pagar</a>
    <a href="caja.html" class="subnav-link">Caja</a>
    <a href="usuarios.html" class="subnav-link">Usuarios</a>
    <a href="cierres.html" class="subnav-link active">Cierres</a>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Cierres de Caja</h1>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="view-tabs no-print">
      <button type="button" class="view-tab" id="tab-week">Semana</button>
      <button type="button" class="view-tab active" id="tab-month">Mes</button>
      <button type="button" class="view-tab" id="tab-year">Año</button>
      <button type="button" class="view-tab" id="tab-all">Todo</button>
    </div>

    <div class="card" id="period-nav-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <button type="button" class="btn btn-outline btn-sm" id="period-prev">&lsaquo; Anterior</button>
      <div id="period-label" style="font-weight:700; font-size:16px;"></div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-outline btn-sm" id="period-today">Actual</button>
        <button type="button" class="btn btn-outline btn-sm" id="period-next">Siguiente &rsaquo;</button>
      </div>
    </div>

    <div class="stats-row" id="stats-row" style="margin-top:22px;"></div>

    <div class="card" style="margin-top:24px;">
      <h2 class="card-title">Cierres del periodo</h2>
      <div id="table-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Sucursal</th>
              <th>Apertura</th>
              <th>Cierre</th>
              <th>Inicial</th>
              <th>Esperado</th>
              <th>Contado</th>
              <th>Diferencia</th>
              <th>Transferencias</th>
            </tr>
          </thead>
          <tbody id="sessions-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No hay cierres de caja en este periodo.
        </div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <script type="module" src="js/cierres.js"></script>
</body>
</html>
