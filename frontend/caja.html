<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Caja</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="caja.html">

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Caja</h1>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div id="caja-content"></div>

    <div class="card" style="margin-top:24px;">
      <h2 class="card-title">Historial de Cajas</h2>
      <div id="history-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Apertura</th>
              <th>Cierre</th>
              <th>Inicial</th>
              <th>Esperado</th>
              <th>Contado</th>
              <th>Diferencia</th>
              <th>Transferencias</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <div class="empty-state" id="history-empty" style="display:none;">
          Todavía no hay cajas cerradas.
        </div>
      </div>
      <div class="pager" id="history-pager"></div>
    </div>
  </main>

  <script type="module" src="js/caja.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
