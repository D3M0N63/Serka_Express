<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Envíos</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="shipments.html">

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Todos los Envíos</h1>
      <a href="new-shipment.html" class="btn btn-primary">+ Registro de Envío</a>
    </div>

    <div class="stats-row" id="stats-row"></div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por código, nombre o CI/RUC..." />
      </div>
      <div id="table-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Código</th>
              <th>Remitente</th>
              <th>Destinatario</th>
              <th>Origen &rarr; Destino</th>
              <th>Estado</th>
              <th>Total</th>
              <th>Valor a cobrar</th>
              <th>Fecha</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="shipments-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          Busca por código, nombre o CI/RUC para ver los envíos.
        </div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <script type="module" src="js/shipments.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
