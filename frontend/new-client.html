<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Nuevo Cliente</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="clients.html">

  <main class="page" style="max-width: 560px;">
    <div class="page-header">
      <h1 class="page-title" id="form-title">Nuevo Cliente</h1>
      <a href="clients.html" class="btn btn-outline">Volver a Clientes</a>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <form id="client-form">
        <div class="field">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="type">Tipo</label>
          <select id="type">
            <option value="Casual">Casual</option>
            <option value="Empresa">Empresa</option>
            <option value="Tienda">Tienda</option>
          </select>
        </div>
        <div class="field">
          <label for="dni">CI/RUC</label>
          <input type="text" id="dni" />
        </div>
        <div class="field">
          <label for="address">Dirección</label>
          <input type="text" id="address" />
        </div>
        <div class="field">
          <label for="phone">Tel</label>
          <input type="text" id="phone" />
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="save-btn">Guardar Cliente</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/new-client.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
