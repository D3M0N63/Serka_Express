<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Nuevo Cliente</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="logo">SERKA <span class="express">EXPRESS</span></div>
          <span class="logo-sub">COURRIER &middot; TODO A TIEMPO</span>
        </div>
      </a>
    </div>
    <div class="topbar-right">
      <a href="profile.html" class="profile-link">
        <div class="avatar" data-user-avatar>AE</div>
        <span class="name" data-user-name>Usuario</span>
      </a>
      <button class="logout-btn" data-logout>Salir</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="dashboard.html" class="subnav-link">Inicio</a>
    <a href="shipments.html" class="subnav-link">Envíos</a>
    <a href="planilla.html" class="subnav-link">Planilla</a>
    <a href="clients.html" class="subnav-link active">Clientes</a>
    <a href="pagar.html" class="subnav-link">Pagar</a>
    <a href="caja.html" class="subnav-link">Caja</a>
    <a href="usuarios.html" class="subnav-link">Usuarios</a>
    <a href="cierres.html" class="subnav-link">Cierres</a>
  </nav>

  <main class="page" style="max-width: 560px;">
    <div class="page-header">
      <h1 class="page-title" id="form-title">Nuevo Cliente</h1>
      <a href="clients.html" class="btn btn-outline">Volver a Clientes</a>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <form id="client-form">
        <div class="field">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="dni">CI/RUC</label>
          <input type="text" id="dni" />
        </div>
        <div class="field">
          <label for="address">Dirección</label>
          <input type="text" id="address" />
        </div>
        <div class="field">
          <label for="phone">Tel</label>
          <input type="text" id="phone" />
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="save-btn">Guardar Cliente</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/new-client.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
