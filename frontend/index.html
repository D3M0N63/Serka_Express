<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Ingresar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body>
  <div class="login-wrap">
    <aside class="login-aside">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <span><span class="logo">SERKA <span class="express">EXPRESS</span></span><span class="logo-sub">Courrier &middot; Todo a tiempo</span></span>
      </div>
      <div class="login-pitch">
        <h2>Cada envío, <em>a tiempo</em> y bajo control.</h2>
        <p>Registro, planilla de ruta, caja y cuentas corrientes en un solo lugar.</p>
      </div>
    </aside>

    <main class="login-main">
      <div class="login-card">
        <div class="login-mobile-brand">
          <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
          <span><span class="logo">SERKA <span class="express">EXPRESS</span></span><span class="logo-sub">Courrier &middot; Todo a tiempo</span></span>
        </div>
        <h1>Ingresar</h1>
        <p class="login-sub">Accedé con tu usuario para continuar.</p>

        <div class="error-banner" id="error-banner" role="alert"></div>

        <form id="login-form">
          <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-dark">Ingresar</button>
        </form>

        <p class="hint"><a href="track.html">Rastrear un envío sin iniciar sesión &rarr;</a></p>
      </div>
    </main>
  </div>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
