<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Clientes</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="clients.html">

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Clientes</h1>
      <a href="new-client.html" class="btn btn-primary">+ Nuevo Cliente</a>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por nombre o CI/RUC..." />
        <div class="field" style="flex:0 0 180px; margin-bottom:0;">
          <select id="filter-type">
            <option value="">Todos los tipos</option>
            <option value="Empresa">Empresa</option>
            <option value="Tienda">Tienda</option>
            <option value="Casual">Casual</option>
          </select>
        </div>
      </div>
      <div id="table-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>CI/RUC</th>
              <th>Dirección</th>
              <th>Tel</th>
              <th>Correo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clients-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No hay clientes registrados todavía.
        </div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <script type="module" src="js/clients.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
