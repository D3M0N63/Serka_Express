<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Rastrear Envío</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="logo">SERKA <span class="express">EXPRESS</span></div>
          <span class="logo-sub">COURRIER &middot; TODO A TIEMPO</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <a href="index.html" style="color:var(--ink); text-decoration:none; font-size:14px; font-weight:600;">Iniciar sesión</a>
    </div>
  </header>

  <main class="page" style="max-width: 640px;">
    <h1 class="page-title" style="margin-bottom: 18px;">Rastrear Envío</h1>

    <div class="card">
      <div class="toolbar" style="margin-bottom:0;">
        <input type="text" id="track-input" placeholder="Ingresa tu código, ej: 304521" />
        <button class="btn btn-primary" id="track-btn">Buscar</button>
      </div>
    </div>

    <div id="result" style="margin-top: 24px;"></div>
  </main>

  <script type="module" src="js/track.js"></script>
</body>
</html>
