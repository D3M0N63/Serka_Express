<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Usuarios</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="usuarios.html">

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Usuarios</h1>
      <a href="new-usuario.html" class="btn btn-primary">+ Nuevo Usuario</a>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="card">
      <div id="table-wrap" class="table-wrap">
        <table class="shipments">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Nombre</th>
              <th>Rol</th>
              <th>Sucursal</th>
              <th>Ciudad</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">
          No hay usuarios registrados todavía.
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/usuarios.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
