<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Mi Perfil</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
</head>
<body data-nav="">

  <main class="page" style="max-width: 520px;">
    <div class="page-header">
      <h1 class="page-title">Mi Perfil</h1>
      <a href="dashboard.html" class="btn btn-outline">Volver al Panel</a>
    </div>

    <div class="error-banner" id="error-banner"></div>
    <div class="success-banner" id="success-banner">Perfil actualizado correctamente.</div>

    <div class="card">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" readonly />
      </div>

      <form id="profile-form">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="city">Ciudad</label>
          <input type="text" id="city" list="py-cities" placeholder="Buscar ciudad..." autocomplete="off" />
          <datalist id="py-cities"></datalist>
        </div>
        <p class="hint" style="text-align:left; margin-top:6px;">
          Esta ciudad se usará como origen por defecto al registrar un nuevo envío.
        </p>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="save-btn">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/profile.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
