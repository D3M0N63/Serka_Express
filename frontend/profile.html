<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Mi Perfil</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="brand">
        <svg class="logo-mark" viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M37 3C25 3 12 9 4 18C12 27 25 33 37 33" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M30 8C21 8 11 12.5 6 18C11 23.5 21 28 30 28" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M23 13C17 13 10 15.5 8 18C10 20.5 17 23 23 23" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="logo">SERKA <span class="express">EXPRESS</span></div>
          <span class="logo-sub">COURRIER &middot; TODO A TIEMPO</span>
        </div>
      </a>
    </div>
    <div class="topbar-right">
      <div class="avatar" data-user-avatar>AE</div>
      <span class="name" data-user-name>Usuario</span>
      <button class="logout-btn" data-logout>Salir</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="dashboard.html" class="subnav-link">Inicio</a>
    <a href="shipments.html" class="subnav-link">Envíos</a>
    <a href="clients.html" class="subnav-link">Clientes</a>
    <a href="caja.html" class="subnav-link">Caja</a>
    <a href="pagar.html" class="subnav-link">Pagar</a>
  </nav>

  <main class="page" style="max-width: 520px;">
    <div class="page-header">
      <h1 class="page-title">Mi Perfil</h1>
      <a href="dashboard.html" class="btn btn-outline">Volver al Panel</a>
    </div>

    <div class="error-banner" id="error-banner"></div>
    <div class="success-banner" id="success-banner">Perfil actualizado correctamente.</div>

    <div class="card">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" readonly />
      </div>

      <form id="profile-form">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="city">Ciudad</label>
          <input type="text" id="city" list="py-cities" placeholder="Buscar ciudad..." autocomplete="off" />
          <datalist id="py-cities"></datalist>
        </div>
        <p class="hint" style="text-align:left; margin-top:6px;">
          Esta ciudad se usará como origen por defecto al registrar un nuevo envío.
        </p>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="save-btn">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
