<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serka Express - Detalle de Envío</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffde02" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serka Express" />
  <style id="print-page-style">
    /* Tamaño de tique termico (80mm) por defecto. Solo aplica a esta
       pagina: Chromium no siempre respeta @page anidado dentro de una
       media query, por eso va como regla de nivel superior aca. Se
       reescribe por JS antes de imprimir la etiqueta (ver detail.js:
       setPrintMode), que usa un tamaño distinto. */
    @page {
      size: 80mm 260mm;
      margin: 0;
    }
  </style>
  <!-- jsPDF: genera el PDF del ticket (sin firmas) para enviar por WhatsApp. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- JsBarcode: codigo de barras de la etiqueta de bulto. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
</head>
<body class="ticket-print-page">

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Envío <span class="code" id="detail-code">-</span></h1>
      <div class="header-actions no-print">
        <a href="dashboard.html" class="btn btn-outline">Volver al Panel</a>
        <button class="btn btn-outline" id="edit-btn">Editar</button>
        <button class="btn btn-outline" id="delete-btn" style="color:var(--red);">Eliminar</button>
        <button class="btn btn-outline" id="whatsapp-btn">Enviar Ticket por WhatsApp</button>
        <button class="btn btn-outline" id="print-etiqueta-btn">Imprimir Etiqueta</button>
        <button class="btn btn-primary" id="print-btn">Imprimir Ticket</button>
      </div>
    </div>

    <div id="content"></div>
    <div id="print-label" class="print-label"></div>
    <div id="print-etiqueta" class="print-etiqueta"></div>
  </main>

  <script type="module" src="js/detail.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
